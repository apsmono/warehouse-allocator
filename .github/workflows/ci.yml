name: CI

on:
  push:
    branches: [main, "m*/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wa
          POSTGRES_PASSWORD: wa
          POSTGRES_DB: warehouse_allocator
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wa -d warehouse_allocator"
          --health-interval 2s
          --health-retries 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (includes DB integration tests)
        env:
          DATABASE_URL: postgresql://wa:wa@localhost:5433/warehouse_allocator
        run: npm test

      - name: Brief-leak check
        env:
          LEAK_MARKERS: ${{ secrets.LEAK_MARKERS }}
        run: bash scripts/check-no-brief.sh
