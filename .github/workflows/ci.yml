name: CI

on:
  push:
    branches: [main, "m*/*"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Brief-leak check
        env:
          LEAK_MARKERS: ${{ secrets.LEAK_MARKERS }}
        run: bash scripts/check-no-brief.sh
