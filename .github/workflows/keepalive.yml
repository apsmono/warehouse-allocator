name: Keep-Alive

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors "https://warehouse-allocator-chi.vercel.app/api/v1/health"
